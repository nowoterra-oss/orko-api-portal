services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orko-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Orko_Portal2026"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Orko_Portal2026" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: orko-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Server=sqlserver,1433;Database=OrkoPortal;User Id=sa;Password=Orko_Portal2026;TrustServerCertificate=True;
      - Frontend__Url=https://orko.nwtsoft.com
      - Evrim__BaseUrl=https://vrbmvc.evrim.com:443/EvrimEntMVC.dll/
      - Evrim__Username=EVRIM_8059
      - Evrim__Password=Evrim8059
      - ApiKey=selsil-test-api-key-2026
    ports:
      - "5045:5045"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://orko.nwtsoft.com/api
        NEXT_PUBLIC_APP_NAME: Orko Portal
    container_name: orko-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver-data:
